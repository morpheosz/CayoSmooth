<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Wooden shipping crate stencilled DENTAL EQUIPMENT, FRAGILE, DO NOT PLAY.">
  <rect width="800" height="600" fill="#f2efe7"/>

  <!-- top face -->
  <path d="M132 196 L182 160 L708 160 L658 196 Z" fill="#e2d6bf" stroke="#b09a76"/>
  <!-- right face -->
  <path d="M658 196 L708 160 L708 428 L658 464 Z" fill="#c8b99b" stroke="#b09a76"/>
  <!-- front face -->
  <rect x="132" y="196" width="526" height="268" fill="#d9cbb0" stroke="#b09a76"/>

  <!-- planks -->
  <g stroke="#c3b191" stroke-width="1.2">
    <path d="M132 264 H658M132 332 H658M132 400 H658"/>
  </g>
  <g stroke="#bfad8c" stroke-width="1" opacity="0.7">
    <path d="M700 216 L666 240M700 284 L666 308M700 352 L666 376"/>
  </g>

  <!-- corner battens -->
  <rect x="132" y="196" width="26" height="268" fill="#cdbc9b" stroke="#b09a76"/>
  <rect x="632" y="196" width="26" height="268" fill="#cdbc9b" stroke="#b09a76"/>

  <!-- stencil: the third instruction carries the weight of the first two -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="27"
     fill="#5a5348" text-anchor="middle" letter-spacing="2" opacity="0.88">
    <text x="395" y="252">DENTAL EQUIPMENT</text>
    <text x="395" y="316">FRAGILE</text>
    <text x="395" y="380">DO NOT PLAY</text>
  </g>

  <!-- crate number -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700" font-size="19"
     fill="#5a5348" opacity="0.8">
    <text x="174" y="440">14</text>
  </g>

  <!-- consignee marking -->
  <text x="616" y="440" text-anchor="end" font-family="Helvetica, Arial, sans-serif"
        font-size="12" fill="#5a5348" opacity="0.6" letter-spacing="1.6">HOLD</text>

  <ellipse cx="400" cy="472" rx="270" ry="9" fill="#ddd8cc" opacity="0.5"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Bound notebook with a marbled cover. Water damage runs across the lower portion of the volume.">
  <defs>
    <pattern id="marble" width="64" height="42" patternUnits="userSpaceOnUse">
      <rect width="64" height="42" fill="#8a6f5c"/>
      <path d="M-4 9 Q12 2 28 9 T60 9 T92 9" fill="none" stroke="#ab8f76" stroke-width="3.2"/>
      <path d="M-4 21 Q12 14 28 21 T60 21 T92 21" fill="none" stroke="#6d5645" stroke-width="2.6"/>
      <path d="M-4 33 Q12 26 28 33 T60 33 T92 33" fill="none" stroke="#9d8168" stroke-width="2.2"/>
    </pattern>
    <clipPath id="coverClip">
      <rect x="248" y="128" width="304" height="344" rx="3"/>
    </clipPath>
  </defs>

  <rect width="800" height="600" fill="#f2efe7"/>

  <!-- page block -->
  <rect x="548" y="136" width="16" height="330" fill="#efe9dc" stroke="#cfc9ba"/>
  <g stroke="#dfd8c8" stroke-width="1">
    <path d="M548 152H564M548 168H564M548 184H564M548 200H564M548 216H564M548 232H564
             M548 248H564M548 264H564M548 280H564M548 296H564M548 312H564M548 328H564
             M548 344H564M548 360H564M548 376H564M548 392H564M548 408H564M548 424H564
             M548 440H564"/>
  </g>

  <!-- cover -->
  <rect x="248" y="128" width="304" height="344" rx="3" fill="url(#marble)" stroke="#5b4736"/>

  <!-- spine -->
  <rect x="226" y="128" width="24" height="344" rx="3" fill="#5f4a39" stroke="#4a382a"/>
  <path d="M232 152 H244M232 448 H244" stroke="#7d6450" stroke-width="2"/>

  <!-- cover label -->
  <g clip-path="url(#coverClip)">
    <rect x="296" y="182" width="210" height="82" fill="#f3ede0" stroke="#c9bda6"/>
    <text x="401" y="212" text-anchor="middle" font-family="Georgia, serif"
          font-size="11" fill="#5b4736" letter-spacing="1.6">CAYO SMOOTH EXPEDITION</text>
    <path d="M320 224 H482" stroke="#d8ceb8"/>
    <text x="401" y="244" text-anchor="middle" font-family="Georgia, serif"
          font-size="12" fill="#3f342a">G. Vandermeer</text>

    <!-- water damage -->
    <path d="M248 472 L552 472 L552 348 Q506 362 474 340 Q436 314 396 344
             Q354 376 314 350 Q282 330 248 358 Z"
          fill="#2f2519" opacity="0.28"/>
    <path d="M248 358 Q282 330 314 350 Q354 376 396 344 Q436 314 474 340 Q506 362 552 348"
          fill="none" stroke="#4a3a28" stroke-width="2" opacity="0.5"/>
    <path d="M248 386 Q288 362 322 380 Q362 404 400 376 Q440 348 476 370 Q508 388 552 376"
          fill="none" stroke="#4a3a28" stroke-width="1.4" opacity="0.32"/>
  </g>

  <!-- damage carries onto the page block -->
  <path d="M548 466 H564 V372 Q556 380 548 374 Z" fill="#2f2519" opacity="0.22"/>

  <text x="400" y="512" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" fill="#a9a498" letter-spacing="1.6">44 LEAVES LEGIBLE IN FULL</text>
</svg>

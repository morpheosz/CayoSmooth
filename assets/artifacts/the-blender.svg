<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Four-speed blender with chrome collar and glass carafe. The motor housing is pitted along the base.">
  <rect width="800" height="600" fill="#f2efe7"/>

  <!-- carafe handle -->
  <path d="M458 196 C512 206, 516 292, 452 310" fill="none" stroke="#c9c4b6" stroke-width="15"/>
  <path d="M458 196 C512 206, 516 292, 452 310" fill="none" stroke="#eef1f2" stroke-width="9"/>

  <!-- lid -->
  <path d="M334 150 L466 150 L462 134 L338 134 Z" fill="#e6e2d8" stroke="#bdb8ac"/>
  <ellipse cx="400" cy="134" rx="62" ry="10" fill="#eeeae0" stroke="#bdb8ac"/>
  <ellipse cx="400" cy="130" rx="17" ry="5" fill="#dcd7ca" stroke="#bdb8ac"/>

  <!-- glass carafe -->
  <path d="M352 358 L448 358 L462 152 L338 152 Z" fill="#eaf0f1" stroke="#b9c2c4" stroke-width="1.4"/>
  <path d="M352 358 L378 358 L372 152 L338 152 Z" fill="#f4f8f8" opacity="0.75"/>
  <path d="M462 152 L456 216 L470 214 Z" fill="#eaf0f1" stroke="#b9c2c4" stroke-width="1.2"/>

  <!-- graduations -->
  <g stroke="#b9c2c4" stroke-width="1.1">
    <path d="M356 330 H376M356 296 H376M356 262 H376M356 228 H376M356 194 H376"/>
  </g>
  <g font-family="Georgia, serif" font-size="9" fill="#9aa3a5">
    <text x="382" y="333">2</text>
    <text x="382" y="299">3</text>
    <text x="382" y="265">4</text>
    <text x="382" y="231">5</text>
    <text x="382" y="197">6</text>
  </g>

  <!-- chrome collar -->
  <path d="M344 380 L456 380 L452 358 L348 358 Z" fill="#d3d8da" stroke="#a9b0b2"/>
  <path d="M346 370 H454" stroke="#eef1f2" stroke-width="2"/>

  <!-- motor housing -->
  <path d="M330 470 L470 470 L458 380 L342 380 Z" fill="#dcd7cc" stroke="#b6b0a3"/>
  <path d="M330 470 L360 470 L350 380 L342 380 Z" fill="#e6e2d8" opacity="0.8"/>

  <!-- four speeds -->
  <g fill="#f4f2ec" stroke="#a9a396">
    <rect x="356" y="424" width="20" height="13" rx="2"/>
    <rect x="382" y="424" width="20" height="13" rx="2"/>
    <rect x="408" y="424" width="20" height="13" rx="2"/>
    <rect x="434" y="424" width="20" height="13" rx="2"/>
  </g>

  <!-- pitting along the base -->
  <g fill="#b6b0a3" opacity="0.75">
    <ellipse cx="350" cy="458" rx="3.5" ry="2.4"/>
    <ellipse cx="371" cy="463" rx="2.6" ry="1.8"/>
    <ellipse cx="392" cy="456" rx="4.2" ry="2.6"/>
    <ellipse cx="416" cy="462" rx="2.4" ry="1.7"/>
    <ellipse cx="438" cy="457" rx="3.6" ry="2.3"/>
    <ellipse cx="455" cy="464" rx="2.8" ry="1.9"/>
    <ellipse cx="404" cy="466" rx="3" ry="2"/>
  </g>

  <ellipse cx="400" cy="474" rx="76" ry="7" fill="#ddd8cc" opacity="0.55"/>
</svg>

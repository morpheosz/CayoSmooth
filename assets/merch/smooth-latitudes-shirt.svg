<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Heavyweight cotton t-shirt with the phrase the smooth latitudes set small in serif on the chest.">
  <rect width="800" height="600" fill="#f2efe7"/>

  <path d="M310 172 Q400 202 490 172 L572 204 L614 288 L548 318 L532 300 L532 476
           L268 476 L268 300 L252 318 L186 288 L228 204 Z"
        fill="#eae7dd" stroke="#b4aea0" stroke-width="1.4"/>

  <!-- collar rib -->
  <path d="M310 172 Q400 202 490 172" fill="none" stroke="#b4aea0" stroke-width="1.4"/>
  <path d="M318 182 Q400 210 482 182" fill="none" stroke="#cdc6b6" stroke-width="1.2"/>

  <!-- sleeve and hem seams -->
  <g fill="none" stroke="#cdc6b6" stroke-width="1.2">
    <path d="M268 300 L252 318"/>
    <path d="M532 300 L548 318"/>
    <path d="M268 464 H532"/>
  </g>

  <text x="400" y="304" text-anchor="middle" font-family="Georgia, serif"
        font-size="17" fill="#3a3d3e" letter-spacing="1.2">the smooth latitudes</text>
</svg>

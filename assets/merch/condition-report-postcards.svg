<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Set of six postcards reproducing the blender's condition reports for 2014 through 2019.">
  <defs>
    <g id="card">
      <rect width="200" height="132" fill="#fdfcf8" stroke="#d8d3c6"/>
      <text x="14" y="24" text-anchor="start" font-family="Georgia, serif" font-size="8"
            fill="#6b6e68" letter-spacing="1.4">CONDITION REPORT</text>
      <path d="M14 32 H186" stroke="#e2ded4"/>
      <g fill="#e8e4d9">
        <rect x="14" y="44" width="150" height="4"/>
        <rect x="14" y="56" width="172" height="4"/>
        <rect x="14" y="68" width="128" height="4"/>
        <rect x="14" y="80" width="160" height="4"/>
      </g>
      <text x="14" y="114" text-anchor="start" font-family="Georgia, serif" font-size="8"
            fill="#a9a498" letter-spacing="1.2">CSE-A-001</text>
    </g>
  </defs>

  <rect width="800" height="600" fill="#f2efe7"/>

  <g font-family="Georgia, serif" font-size="15" fill="#2b2e2f" text-anchor="end">
    <g transform="translate(80 140)"><use href="#card"/><text x="186" y="114">2014</text></g>
    <g transform="translate(300 140)"><use href="#card"/><text x="186" y="114">2015</text></g>
    <g transform="translate(520 140)"><use href="#card"/><text x="186" y="114">2016</text></g>
    <g transform="translate(80 310)"><use href="#card"/><text x="186" y="114">2017</text></g>
    <g transform="translate(300 310)"><use href="#card"/><text x="186" y="114">2018</text></g>
    <g transform="translate(520 310)"><use href="#card"/><text x="186" y="114">2019</text></g>
  </g>

  <text x="400" y="486" text-anchor="middle" font-family="Georgia, serif"
        font-size="10" fill="#a9a498" letter-spacing="1.6">THE SET IS COMPLETE</text>
</svg>

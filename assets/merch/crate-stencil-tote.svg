<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img"
     aria-label="Cotton canvas tote carrying the Crate 14 stencil: DENTAL EQUIPMENT, FRAGILE, DO NOT PLAY.">
  <defs>
    <pattern id="weave" width="6" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3h6M3 0v6" stroke="#ded5c2" stroke-width="0.6"/>
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#f2efe7"/>

  <!-- handles, behind the body -->
  <g fill="none" stroke="#d8cfbb" stroke-width="15" stroke-linecap="round">
    <path d="M330 200 C330 118, 470 118, 470 200"/>
  </g>
  <g fill="none" stroke="#c4b9a2" stroke-width="1" stroke-linecap="round">
    <path d="M322 200 C322 112, 478 112, 478 200"/>
    <path d="M338 200 C338 124, 462 124, 462 200"/>
  </g>

  <!-- body -->
  <path d="M232 188 h336 a6 6 0 0 1 6 6 l14 300 a10 10 0 0 1 -10 10 h-356 a10 10 0 0 1 -10 -10 l14 -300 a6 6 0 0 1 6 -6 z"
        fill="#e8e1d2" stroke="#c4b9a2"/>
  <path d="M232 188 h336 a6 6 0 0 1 6 6 l14 300 a10 10 0 0 1 -10 10 h-356 a10 10 0 0 1 -10 -10 l14 -300 a6 6 0 0 1 6 -6 z"
        fill="url(#weave)" stroke="none" opacity="0.7"/>

  <!-- top hem -->
  <path d="M228 214 H572" stroke="#c4b9a2" stroke-width="1"/>

  <!-- stencil: all three instructions set at one weight -->
  <g font-family="Helvetica, Arial, sans-serif" font-weight="700"
     font-size="30" fill="#4a4640" text-anchor="middle" letter-spacing="1.5">
    <text x="400" y="316">DENTAL</text>
    <text x="400" y="356">EQUIPMENT</text>
    <text x="400" y="410">FRAGILE</text>
    <text x="400" y="464">DO NOT PLAY</text>
  </g>
</svg>
